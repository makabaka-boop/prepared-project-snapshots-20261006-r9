<!doctype html><meta charset="utf-8"><title>固定比例光谱复核</title><h1>组比例约束解混</h1><textarea id="request" rows="18" cols="100"></textarea><button id="run">精确复核</button><output id="status"></output><svg id="chart" width="600" height="220"></svg><pre id="result"></pre><button id="download">下载同次结果</button><script>
const $=id=>document.getElementById(id);let generation=0,result=null;
$('request').value=JSON.stringify({input:{wavelengths:Array.from({length:20},(_,i)=>i),observations:[3,4,...Array(18).fill(0)],references:[[1,0,...Array(18).fill(0)],[0,1,...Array(18).fill(0)]]},groups:[{id:'blend',members:[{index:0,ratio:{num:'1',den:'1'}},{index:1,ratio:{num:'2',den:'1'}}]}]},null,2);
function clear(){generation++;result=null;$('result').textContent='';$('chart').innerHTML='';$('status').textContent='输入已变化';}
$('request').oninput=clear;
$('run').onclick=async()=>{const token=generation,body=$('request').value;result=null;try{const response=await fetch('/api/grouped',{method:'POST',headers:{'Content-Type':'application/json'},body});const candidate=await response.json();if(token!==generation)return;if(!response.ok)throw Error(candidate.error?.message||'请求失败');result=candidate;$('result').textContent=JSON.stringify(result,null,2);$('status').textContent='精确复核完成';$('chart').innerHTML='';for(const [name,color] of [['observed','blue'],['reconstructed','green'],['residual','red']]){const values=result.points.map(point=>typeof point[name]==='number'?point[name]:Number(point[name].numerator)/Number(point[name].denominator));const maximum=Math.max(1,...result.points.flatMap(point=>['observed','reconstructed','residual'].map(key=>Math.abs(typeof point[key]==='number'?point[key]:Number(point[key].numerator)/Number(point[key].denominator)))));const path=document.createElementNS('http://www.w3.org/2000/svg','polyline');path.setAttribute('points',values.map((v,i)=>((result.points[i].wavelength-result.points[0].wavelength)*580/(result.points.at(-1).wavelength-result.points[0].wavelength)+10)+','+(110-v/maximum*90)).join(' '));path.setAttribute('fill','none');path.setAttribute('stroke',color);path.dataset.series=name;$('chart').append(path);}}catch(error){if(token===generation){$('status').textContent='拒绝：'+error.message;$('chart').innerHTML='';$('result').textContent='';}}};
$('download').onclick=()=>{if(!result)return;const url=URL.createObjectURL(new Blob([JSON.stringify(result,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='grouped-spectrum.json';a.click();URL.revokeObjectURL(url);};
</script>
