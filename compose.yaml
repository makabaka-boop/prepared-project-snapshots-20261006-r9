services:
  dxf-review:
    build: .
    image: dxf-block-review:latest
    container_name: dxf-block-review
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
