server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # 静态资源：短缓存；HTML 不缓存，保证发布后立即生效
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location ~* \.(?:js|css)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # DXF 为本地浏览器解析，不经服务端；此处仅允许作为静态文件下载
    types {
        text/html html;
        text/css css;
        application/javascript js;
        image/svg+xml svg;
    }
}
